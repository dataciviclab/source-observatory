name: observatory

on:
  workflow_dispatch:
  schedule:
    # Ogni lunedì 03:20 (5 min dopo radar)
    - cron: "20 3 * * 1"

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  CATALOG_INVENTORY_GCS_PREFIX: ${{ secrets.CATALOG_INVENTORY_GCS_PREFIX }}

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main

      # ── GCS Auth ──────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        uses: google-github-actions/setup-gcloud@v3

      # ═══════════════════════════════════════════════════════════════════
      # STEP 1 — INVENTORY BUILD
      # ═══════════════════════════════════════════════════════════════════
      - name: Download previous inventory (for source-check merge)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        run: |
          prefix='${{ env.CATALOG_INVENTORY_GCS_PREFIX }}'
          prefix="${prefix%/}"
          mkdir -p data/catalog_inventory/generated
          gcloud storage cp "$prefix/catalog_inventory_latest.parquet" \
            data/catalog_inventory/generated/catalog_inventory_latest.parquet || echo "No inventory snapshot yet"

      - name: Build catalog inventory
        run: |
          python scripts/build_catalog_inventory.py \
            --out-dir data/catalog_inventory/generated \
            --workers 16 \
            --skip-red-sources

      # ═══════════════════════════════════════════════════════════════════
      # STEP 2 — PIPELINE (merge + validate)
      # ═══════════════════════════════════════════════════════════════════
      - name: Clean old artifacts
        run: |
          rm -f data/catalog/CATALOG_WATCH_REPORT.md

      - name: Run pipeline (merge + validate)
        run: |
          python scripts/pipeline/run_pipeline.py \
            --workers 16

      # ═══════════════════════════════════════════════════════════════════
      # STEP 3 — SOURCE REPORTS
      # ═══════════════════════════════════════════════════════════════════
      - name: Build source reports
        run: |
          python scripts/build_source_reports.py

      - name: Commit results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/pipeline/validated.parquet data/pipeline/summary.json
          git add -f data/catalog_inventory/generated/catalog_inventory_latest.parquet \
                     data/catalog_inventory/generated/catalog_inventory_report.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione."
          else
            git commit -m "chore(so): aggiorna reports e parquet [ci skip]"
            git push
          fi

      # ═══════════════════════════════════════════════════════════════════
      # STEP 4 — UPLOAD GCS
      # ═══════════════════════════════════════════════════════════════════
      - name: Upload validated results to GCS
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        run: |
          stamp=$(python3 -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S'))")
          prefix='${{ env.CATALOG_INVENTORY_GCS_PREFIX }}'
          prefix="${prefix%/}"
          python scripts/gha/gcs_upload.py \
            data/pipeline/validated.parquet \
            "$prefix/pipeline/validated.parquet"
          python scripts/gha/gcs_upload.py \
            data/pipeline/validated.parquet \
            "$prefix/pipeline/snapshots/validated_${stamp}.parquet"
          python scripts/gha/gcs_upload.py \
            data/pipeline/summary.json \
            "$prefix/pipeline/summary_${stamp}.json"

      - name: Upload inventory snapshot to GCS
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        run: |
          stamp=$(python3 -c "
          import json
          report = json.load(open('data/catalog_inventory/generated/catalog_inventory_report.json'))
          print(report['captured_at'].replace(':', '').replace('-', ''))
          ")
          prefix='${{ env.CATALOG_INVENTORY_GCS_PREFIX }}'
          prefix="${prefix%/}"
          python scripts/gha/gcs_upload.py \
            data/catalog_inventory/generated/catalog_inventory_latest.parquet \
            "$prefix/catalog_inventory_latest.parquet"
          python scripts/gha/gcs_upload.py \
            data/catalog_inventory/generated/catalog_inventory_report.json \
            "$prefix/catalog_inventory_report.json"
          python scripts/gha/gcs_upload.py \
            data/catalog_inventory/generated/catalog_inventory_latest.parquet \
            "$prefix/snapshots/catalog_inventory_${stamp}.parquet"
          python scripts/gha/gcs_upload.py \
            data/catalog_inventory/generated/catalog_inventory_report.json \
            "$prefix/snapshots/catalog_inventory_report_${stamp}.json"

      # ═══════════════════════════════════════════════════════════════════
      # STEP 5 — ARTIFACTS
      # ═══════════════════════════════════════════════════════════════════
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: observatory-results
          path: |
            data/pipeline/validated.parquet
            data/pipeline/summary.json
            data/catalog_inventory/generated/catalog_inventory_latest.parquet
            data/radar/radar_summary.json

      - name: Publish radar summary
        run: |
          python scripts/gha/publish_radar_summary.py
          cat radar_summary.md >> "$GITHUB_STEP_SUMMARY"
