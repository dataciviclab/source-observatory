name: observatory

on:
  workflow_dispatch:
  schedule:
    # Lunedì 03:15 — inventory + signals
    - cron: "15 3 * * 1"
    # Martedì 05:00 — source-check (dipende da inventory del lunedì)
    - cron: "0 5 * * 2"

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observatory:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      CATALOG_INVENTORY_GCS_PREFIX: ${{ secrets.CATALOG_INVENTORY_GCS_PREFIX }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── GCS Auth ──────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        uses: google-github-actions/setup-gcloud@v3

      # ── Inventory: download baseline + previous report ──────────────────
      - name: Download previous report for signals delta
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        run: |
          prefix='${{ env.CATALOG_INVENTORY_GCS_PREFIX }}'
          prefix="${prefix%/}"
          gcloud storage cp "$prefix/catalog_inventory_report.json" previous_report.json || echo "{}" > previous_report.json

      - name: Download catalog inventory parquet from GCS
        id: download_inventory
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        run: |
          prefix='${{ env.CATALOG_INVENTORY_GCS_PREFIX }}'
          prefix="${prefix%/}"
          mkdir -p data/catalog_inventory/generated
          gcloud storage cp "$prefix/catalog_inventory_latest.parquet" \
            data/catalog_inventory/generated/catalog_inventory_latest.parquet

      # ── Inventory: build ────────────────────────────────────────────────
      - name: Build catalog inventory
        run: |
          python scripts/build_catalog_inventory.py \
            --out-dir data/catalog_inventory/generated \
            --workers 4

      # ── Signals: build (uses previous for delta) ──────────────────────────
      - name: Build catalog signals
        run: |
          python scripts/build_catalog_signals.py \
            --report data/catalog_inventory/generated/catalog_inventory_report.json \
            --previous previous_report.json \
            --radar data/radar/radar_summary.json \
            --out data/catalog/catalog_signals.json \
            --report-out data/catalog/CATALOG_WATCH_REPORT.md

      - name: Commit catalog signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog/catalog_signals.json data/catalog/CATALOG_WATCH_REPORT.md
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei segnali."
          else
            git commit -m "chore(so): aggiorna catalog_signals e watch report [ci skip]"
            git push
          fi

      # ── Diff alert ─────────────────────────────────────────────────────────
      - name: Generate diff and alert
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json,sys; d=json.load(open('previous_report.json')); sys.exit(0 if d.get('sources') else 1)"; then
            python scripts/catalog_diff.py previous_report.json data/catalog_inventory/generated/catalog_inventory_report.json --output diff.md
          else
            echo "Nessun baseline precedente — skip diff (primo run)."
            exit 0
          fi

          if [ -s diff.md ]; then
            echo "Diff rilevato."
            ISSUE_TITLE="[Catalog] Variazioni rilevate nell'inventario"
            EXISTING=$(gh issue list --label "catalog-alert" --state open --json number,title --jq ".[] | select(.title==\"$ISSUE_TITLE\") | .number" | head -1)
            if [ -n "$EXISTING" ]; then
              echo "Aggiorno issue #$EXISTING esistente."
              gh issue comment "$EXISTING" --body-file diff.md
            else
              echo "Apro nuova issue."
              gh issue create --title "$ISSUE_TITLE" --body-file diff.md --label "catalog-alert"
            fi
          else
            echo "Nessuna variazione rilevata."
          fi

      # ── Source-check ──────────────────────────────────────────────────────
      - name: Run bulk source-check
        run: |
          python scripts/bulk_source_check.py \
            --only-with-title \
            --include-no-url \
            --max-items 500 \
            --workers 8

      # ── Upload to GCS ─────────────────────────────────────────────────────
      - name: Upload inventory snapshot to GCS
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        run: |
          stamp=$(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/catalog_inventory/generated/catalog_inventory_report.json").read_text(encoding="utf-8"))
          print(report["captured_at"].replace(":", "").replace("-", ""))
          PY
          )
          prefix='${{ env.CATALOG_INVENTORY_GCS_PREFIX }}'
          prefix="${prefix%/}"
          gcloud storage cp data/catalog_inventory/generated/catalog_inventory_latest.parquet "$prefix/catalog_inventory_latest.parquet"
          gcloud storage cp data/catalog_inventory/generated/catalog_inventory_report.json "$prefix/catalog_inventory_report.json"
          gcloud storage cp data/catalog_inventory/generated/catalog_inventory_latest.parquet "$prefix/snapshots/catalog_inventory_${stamp}.parquet"
          gcloud storage cp data/catalog_inventory/generated/catalog_inventory_report.json "$prefix/snapshots/catalog_inventory_report_${stamp}.json"

      - name: Upload source-check results to GCS
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.CATALOG_INVENTORY_GCS_PREFIX != '' }}
        run: |
          stamp=$(python -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S'))")
          prefix='${{ env.CATALOG_INVENTORY_GCS_PREFIX }}'
          prefix="${prefix%/}"
          gcloud storage cp data/catalog_inventory/generated/source_check_results.parquet \
            "$prefix/source-check/source_check_results.parquet"
          gcloud storage cp data/catalog_inventory/generated/source_check_results.parquet \
            "$prefix/source-check/snapshots/source_check_${stamp}.parquet"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: observatory-results
          path: |
            data/catalog_inventory/generated/catalog_inventory_latest.parquet
            data/catalog_inventory/generated/catalog_inventory_report.json
            data/catalog_inventory/generated/source_check_results.parquet
            data/catalog/catalog_signals.json
            data/catalog/CATALOG_WATCH_REPORT.md

      # ── Summaries ─────────────────────────────────────────────────────────
      - name: Publish catalog inventory summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("data/catalog_inventory/generated/catalog_inventory_report.json").read_text(encoding="utf-8"))
          repo = "${{ github.repository }}"
          sha = "${{ github.sha }}"

          lines = ["## Catalog inventory", ""]
          sources = report.get("sources", {})
          error_count = sum(1 for info in sources.values() if info.get("status") == "error")
          ok_count = sum(1 for info in sources.values() if info.get("status") == "ok")
          total_count = len(sources)

          if error_count > 0:
              lines.append(f"> [!WARNING]\n> {error_count}/{total_count} source hanno riportato errori.")
              lines.append("")

          lines.append(f"- Fonti inventariate: {ok_count}/{total_count}")
          lines.append("")

          for source_id, info in sources.items():
              status = info.get("status")
              if status == "ok":
                  lines.append(f"- `{source_id}`: ok ({info.get('rows')} item)")
              elif status in ("non_inventariabile", "protocol_not_supported"):
                  lines.append(f"- `{source_id}`: {status.replace('_', ' ')}")
              else:
                  err = info.get("error") or info.get("reason", "n/d")
                  lines.append(f"- `{source_id}`: errore ({err})")

          Path("catalog_summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat catalog_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish source-check summary
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          df = pd.read_parquet("data/catalog_inventory/generated/source_check_results.parquet")
          candidates = int(df["intake_candidate"].sum()) if "intake_candidate" in df.columns else 0
          reachable = int(df["reachable"].sum()) if "reachable" in df.columns else 0
          total = len(df)
          avg_score = df["intake_score"].mean() if "intake_score" in df.columns else 0

          lines = ["## Source check results", ""]
          lines.append(f"- Item controllati: {total}")
          if total:
              lines.append(f"- Raggiungibili: {reachable} ({reachable/total*100:.0f}%)")
          lines.append(f"- Intake candidates (score ≥ 40): {candidates}")
          lines.append(f"- Score medio: {avg_score:.0f}")
          lines.append("")

          if "granularity" in df.columns:
              lines.append("**Granularità:**")
              for gran, n in df["granularity"].value_counts().items():
                  lines.append(f"- {gran}: {n}")

          Path("source_check_summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat source_check_summary.md >> "$GITHUB_STEP_SUMMARY"