name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Guardia sul workflow daily `radar`: deve girare con le sole dipendenze
  # base. Se un import reintroduce un extra (es. ruamel), questo job fallisce
  # prima che il radar schedulato si rompa in produzione.
  base-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Python setup (base only)
        uses: dataciviclab/.github/actions/python-setup@main

      - name: Import daily modules with base deps
        run: |
          python -c "import scripts.sync_datasets_in_use, scripts.radar_check"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,central,mcp"

      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "scripts/ tests/ so_mcp/"
          mypy_paths: "scripts/ so_mcp/"
          test_dir: "tests"
          pytest_args: "-v"
          cov_threshold: "60"

      - name: Validate sources_registry.yaml
        run: |
          python -c "
          import yaml, sys
          with open('data/radar/sources_registry.yaml') as f:
              data = yaml.safe_load(f)
          sources = list(data.keys())
          print(f'OK — {len(sources)} fonti caricate:', sources)
          for sid, cfg in data.items():
              assert 'protocol' in cfg, f'{sid}: missing protocol'
              assert 'observation_mode' in cfg, f'{sid}: missing observation_mode'
              assert 'verdict' in cfg, f'{sid}: missing verdict'
          print('Schema validation OK')
          "
