[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-source-observatory"
dynamic = ["version"]
description = "DataCivicLab Source Observatory: scouting, radar, inventory e source-check"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  { name = "DataCivicLab" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "requests>=2.34.2",
  "pyyaml>=6.0.3",
  "ruamel.yaml>=0.19.1",
  "duckdb>=1.5.3",
  "pandas>=3.0.3",
  "pyarrow>=24.0.0",
  "jsonschema>=4.26.0",
  "mcp>=1.27.1",
  "fastmcp>=3.3.1",
  "ddgs>=9.14.4",
  "lab-connectors[duckdb,gcs] @ git+https://github.com/dataciviclab/lab-connectors.git@v0.13.1",
  "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git@v1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "pytest-timeout>=2.4.0",
  "ruff>=0.15.14",
  "mypy>=2.0.0",
  "types-requests",
  "types-pyyaml",
  "pandas-stubs",
]

[project.urls]
Repository = "https://github.com/dataciviclab/source-observatory"

[tool.setuptools.packages.find]
include = ["so_mcp", "so_mcp.*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "so_mcp.__version__" }

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/collectors"]
addopts = "-q --tb=line --cov=scripts/ --cov=so_mcp/ --timeout=30"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "contract: interfaccia pubblica, artifact format, contratto API",
    "policy: regola Lab non ovvia",
    "regression: bug fix documentato in issue/PR",
    "adapter: adapter a servizio esterno",
    "pure_unit: logica pura non banale, zero side effect",
    "smoke: test che fa chiamate HTTP reali (richiede connettivita')",
]
